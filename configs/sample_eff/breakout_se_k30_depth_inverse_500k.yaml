# Does depth weighting undo the rollout-length degradation? K=30, everything else as breakout_se_k30_500k.
#
# The gradient anatomy found that the K depth terms of the latent loss start to conflict as K grows:
# 0% of pairs oppose each other at K=5 and K=10, 3.3% at K=20, 8.4% at K=30, while mean pairwise
# alignment falls +0.48 -> +0.28 and the action's share of credit from the deepest term drops 2.2x.
# A slowly-varying feature is the compromise all depths agree on -- predictable everywhere, useless
# for control -- which matches the measured smoothing (delta-probe persistence at delta=1: -0.067 at
# K=5, +0.609 at K=30) and the collapse in score (+65.1 -> +36.9).
#
# This arm keeps the K=30 rollout and only re-weights the depth terms (inverse), tilting the sum back
# toward the shallow terms that still carry the action. If the conflict account is right, control
# should recover toward the K=5 level while the long-horizon model stays better than K=5's.
name: breakout_se_k30_depth_inverse_500k
seed: 0
device: auto
network:
  motion_channels: true
env:
  id: ALE/Breakout-v5
  sticky_action_prob: 0.25      # primary experiment: explicit
  frame_skip: 1
  action_repeat: 4
  screen_size: 84
  history: 4
  noop_max: 30
  fire_on_reset: true           # Breakout needs FIRE to launch the ball
  fire_on_life_loss: true       # and a new serve after each lost life; see README
loss:
  q_imagined: true
  jepa: true
  reward: true
  continuation: true
  variance: true
  jepa_target: delta
  jepa_depth_weight: inverse
  n_step: 5
  lambda_q: 1.0
  lambda_jepa: 1.0
  lambda_reward: 1.0
  lambda_continue: 1.0
  lambda_var: 1.0
  gamma: 0.99
  variance_floor: 0.1
replay:
  capacity: 100000
  rollout_steps: 30
  save_with_checkpoint: true
optim:
  batch_size: 32
  lr: 1.0e-4
  grad_clip_norm: 10.0
  tau: 0.99
train:
  total_decisions: 500000
  warmup_decisions: 5000
  update_every: 4
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_decisions: 50000
  checkpoint_every_decisions: 100000
  eval_every_decisions: 100000
  eval_episodes: 3
  eval_max_episode_decisions: 10000
  eval_controllers: [q, lookahead]
eval:
  episodes: 10
  seed_base: 10000
  epsilon: 0.0
diagnostics:
  depths: [1, 3, 5, 10, 20, 30]
