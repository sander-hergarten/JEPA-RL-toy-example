# Does capping the value-head supervision rescue the long-rollout arms?
#
# The K sweep found that longer training rollouts give a strictly better model (lower latent error at
# every depth, ~2x the root action sensitivity, a better movement probe) but strictly worse control,
# with the damage largest for the shallow controllers. q_imagined trains Q on z_hat[0..K-1], so a K=20
# arm draws most of its value signal from deep imagined latents. These arms keep the long rollout and
# cap the Q supervision at 5 depths, so K and the value horizon move independently.
name: breakout_se_k10_qd5_500k
seed: 0
device: auto
network:
  motion_channels: true
env:
  id: ALE/Breakout-v5
  sticky_action_prob: 0.25      # primary experiment: explicit
  frame_skip: 1
  action_repeat: 4
  screen_size: 84
  history: 4
  noop_max: 30
  fire_on_reset: true           # Breakout needs FIRE to launch the ball
  fire_on_life_loss: true       # and a new serve after each lost life; see README
loss:
  q_imagined: true
  q_imagined_depth: 5        # value head sees only depths 0..4, whatever K is
  jepa: true
  reward: true
  continuation: true
  variance: true
  jepa_target: delta
  n_step: 5
  lambda_q: 1.0
  lambda_jepa: 1.0
  lambda_reward: 1.0
  lambda_continue: 1.0
  lambda_var: 1.0
  gamma: 0.99
  variance_floor: 0.1
replay:
  capacity: 100000
  rollout_steps: 10
  save_with_checkpoint: true
optim:
  batch_size: 32
  lr: 1.0e-4
  grad_clip_norm: 10.0
  tau: 0.99
train:
  total_decisions: 500000
  warmup_decisions: 5000
  update_every: 4
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_decisions: 50000
  checkpoint_every_decisions: 100000
  eval_every_decisions: 100000
  eval_episodes: 3
  eval_max_episode_decisions: 10000
  eval_controllers: [q, lookahead]
eval:
  episodes: 10
  seed_base: 10000
  epsilon: 0.0
diagnostics:
  depths: [1, 3, 5, 10, 20, 30]
