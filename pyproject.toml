[project]
name = "atari-jepa"
version = "0.1.0"
description = "A small, inspectable JEPA-style latent world model for Atari (Pong first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.1",
    "ale-py>=0.11",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Choose exactly one torch build: `uv sync --extra cpu` or `uv sync --extra cu130`.
cpu = ["torch>=2.6"]
cu130 = ["torch>=2.6"]
cu126 = ["torch>=2.6"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
atari-jepa-train = "atari_jepa.train:main"
atari-jepa-evaluate = "atari_jepa.evaluate:main"
atari-jepa-diagnostics = "atari_jepa.diagnostics:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atari_jepa"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
