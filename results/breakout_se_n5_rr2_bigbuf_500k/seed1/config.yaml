name: breakout_se_n5_rr2_bigbuf_500k
seed: 1
device: auto
torch_threads: 1
run_dir: null
env:
  id: ALE/Breakout-v5
  sticky_action_prob: 0.25
  frame_skip: 1
  action_repeat: 4
  screen_size: 84
  history: 4
  noop_max: 30
  full_action_space: false
  terminal_on_life_loss: false
  fire_on_reset: true
  fire_on_life_loss: true
  max_episode_frames: 108000
  max_episode_decisions: null
  reward_transform: sign
network:
  encoder_channels:
  - 32
  - 64
  - 64
  action_embed_dim: 16
  dynamics_blocks: 2
  q_hidden: 512
  reward_hidden: 256
  continuation_hidden: 256
  inverse_hidden: 256
  motion_channels: true
  conv_dtype: float32
loss:
  q_imagined: true
  jepa: true
  reward: true
  continuation: true
  variance: true
  covariance: false
  inverse: none
  jepa_target: delta
  lambda_q: 1.0
  lambda_jepa: 1.0
  lambda_reward: 1.0
  lambda_continue: 1.0
  lambda_var: 1.0
  lambda_cov: 0.0
  lambda_inverse: 1.0
  gamma: 0.99
  n_step: 5
  huber_delta: 1.0
  variance_floor: 0.1
  variance_eps: 0.0001
  cosine_eps: 1.0e-08
replay:
  capacity: 300000
  rollout_steps: 5
  save_with_checkpoint: true
optim:
  batch_size: 32
  lr: 0.0001
  adam_eps: 0.00015
  grad_clip_norm: 10.0
  tau: 0.99
train:
  total_decisions: 500000
  warmup_decisions: 5000
  update_every: 2
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_decisions: 50000
  log_every_updates: 250
  checkpoint_every_decisions: 100000
  eval_every_decisions: 100000
  eval_episodes: 3
  eval_controllers:
  - q
  - lookahead
  eval_max_episode_decisions: 10000
  init_from: null
  freeze_encoder: false
  collect_controller: q
  collect_switch_decisions: 0
  reset_heads_every_updates: 0
  reset_shrink: 0.5
eval:
  episodes: 10
  seed_base: 10000
  epsilon: 0.0
  max_episode_decisions: 27000
planning:
  horizon: 1
  beam_width: 16
diagnostics:
  episodes: 4
  max_decisions: 20000
  seed_base: 20000
  policy_epsilon: 0.1
  depths:
  - 1
  - 3
  - 5
  - 10
  batch_size: 64
pretrain:
  dataset: null
  updates: 50000
  batch_size: 32
  rollout_steps: 5
  lr: 0.0001
  adam_eps: 0.00015
  grad_clip_norm: 10.0
  tau: 0.99
  latent_loss: mse
  jepa_target: absolute
  anti_collapse: sigreg
  lambda_jepa: 1.0
  lambda_anti: 1.0
  sigreg_directions: 64
  variance_floor: 0.1
  log_every: 500
