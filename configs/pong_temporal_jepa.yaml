# Variant B: temporal representation. Root Q-loss + K-step temporal JEPA + variance floor.
# No reward/continuation heads and no imagined-state Q; the controller is the Q-policy.
name: pong_temporal_jepa
seed: 0
device: auto
env:
  id: ALE/Pong-v5
  sticky_action_prob: 0.25      # primary experiment: explicit
  frame_skip: 1
  action_repeat: 4
  screen_size: 84
  history: 4
  noop_max: 30
  fire_on_reset: false          # Pong serves without FIRE; see README
loss:
  q_imagined: false
  jepa: true
  reward: false
  continuation: false
  variance: true
  lambda_q: 1.0
  lambda_jepa: 1.0
  lambda_reward: 1.0
  lambda_continue: 1.0
  lambda_var: 1.0
  gamma: 0.99
  variance_floor: 0.1
replay:
  capacity: 100000
  rollout_steps: 5
  save_with_checkpoint: true
optim:
  batch_size: 32
  lr: 1.0e-4
  grad_clip_norm: 10.0
  tau: 0.99
train:
  total_decisions: 100000
  warmup_decisions: 5000
  update_every: 4
  eps_start: 1.0
  eps_end: 0.1
  eps_decay_decisions: 50000
  checkpoint_every_decisions: 10000
  eval_every_decisions: 25000
  eval_episodes: 3
  eval_controllers: [q]
eval:
  episodes: 10
  seed_base: 10000
  epsilon: 0.0
